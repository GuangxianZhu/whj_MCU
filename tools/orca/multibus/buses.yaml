# 多块 M7C 的路由表：哪几个电机 ID 归哪块板。
# 放在你用的那个 config.yaml 的同一个文件夹里，文件名必须是 buses.yaml。

# 舵机总线的波特率（所有板一样）。这里写了就以这里为准。
baudrate: 1000000

# false = 一条一条轮流发（先用这个）；true = 每条总线一个线程同时发。
parallel: false

buses:
  # 名字随便起，只用来在报错信息里指给你看是哪一条。
  # 不用写 COM 号：启动时会自动 ping，谁回答了 7、8、9，谁就是 index。
  index:  [7, 8, 9]     # 食指：abd、MCP、PIP
  middle: [6, 17, 2]    # 中指：abd、MCP、PIP

  # 以后 6 块板时，把下面 4 行前面的 # 去掉即可，代码不用改：
  # ring:      [5, 4, 3]       # 无名指
  # pinky:     [14, 15, 16]    # 小指
  # thumb:     [13, 12, 11]    # 拇指 3 个
  # wrist_cmc: [1, 10]         # 手腕 + 拇指 CMC

  # 如果自动找不到，也可以把 COM 号写死（两种写法可以混用）：
  # index: {ids: [7, 8, 9], port: COM5}
