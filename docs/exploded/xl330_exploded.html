<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XL330 信号链爆炸图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; header top-left, part sheet right, control dock bottom. Studio-gray drafting look, amber "probe" accent. */
:root{
  --bg:#e6e9ec; --bg2:#f6f7f8; --ink:#14191f; --ink2:#4d5763; --ink3:#7d8793;
  --line:rgba(20,32,44,.12); --panel:rgba(249,250,251,.84); --panel2:rgba(236,239,242,.9);
  --accent:#c98712; --accent-ink:#1d1405; --accent-soft:rgba(201,135,18,.14);
  --grid:#aeb6bf; --ok:#2b8a4a; --off:#9aa3ad;
  --w5:#d9423b; --wg:#2a2d31; --w33:#ee7d22; --wdir:#2f6fd6; --wrx:#2b9a4a; --wtx:#c9a21a; --wdata:#8b4fd0;
  --f-disp:"Barlow Condensed","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1014; --bg2:#1b222a; --ink:#e7ebee; --ink2:#a3aeb9; --ink3:#6f7b87;
  --line:rgba(255,255,255,.09); --panel:rgba(17,22,28,.78); --panel2:rgba(28,35,43,.86);
  --accent:#f0b24a; --accent-ink:#1d1405; --accent-soft:rgba(240,178,74,.14);
  --grid:#28313b; --ok:#4cc172; --off:#56616c; --wg:#8d969f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1014; --bg2:#1b222a; --ink:#e7ebee; --ink2:#a3aeb9; --ink3:#6f7b87;
  --line:rgba(255,255,255,.09); --panel:rgba(17,22,28,.78); --panel2:rgba(28,35,43,.86);
  --accent:#f0b24a; --accent-ink:#1d1405; --accent-soft:rgba(240,178,74,.14);
  --grid:#28313b; --ok:#4cc172; --off:#56616c; --wg:#8d969f; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 55% 30%,var(--bg2),var(--bg) 70%)}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}

/* header */
#head{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(620px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
h1{margin:0;font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
#chain{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;padding:2px 0;scrollbar-width:none}
#chain::-webkit-scrollbar{display:none}
.node{flex:none;display:flex;flex-direction:column;gap:1px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;text-align:left}
.node b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.node span{font-size:11px;color:var(--ink2)}
.node:hover,.node.on{border-color:var(--accent);background:var(--accent-soft)}
.link{flex:none;font-family:var(--f-mono);font-size:10px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.link i{font-style:normal;color:var(--ink2);font-size:13px}

/* side sheet */
#sheet{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - var(--dockh,130px) - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
#sheet .grip{display:none}
#sheetBody{overflow-y:auto;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.crumb{font-family:var(--f-mono);font-size:11px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pname{font-family:var(--f-disp);font-weight:600;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.pen{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--panel2)}
.tag.where{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.role{line-height:1.7;color:var(--ink);margin:0}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
.specs dt{color:var(--ink3);white-space:nowrap}
.specs dd{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tip{font-size:12.5px;line-height:1.65;padding:9px 11px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--accent);color:var(--ink)}
.tip b{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.guide{margin:0;padding-left:18px;line-height:1.75;color:var(--ink2);font-size:13px}
.guide b{color:var(--ink);font-weight:500}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h3{margin:6px 0 4px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.pl{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;border:0;background:none;cursor:pointer;text-align:left;font-size:13px;width:100%}
.pl:hover{background:var(--accent-soft)}
.pl .sw{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid var(--line)}
.pl small{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
details.wires summary{cursor:pointer;font-size:13px;padding:5px 8px;color:var(--ink2)}

/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(900px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.drow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#play{width:38px;height:38px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
#play svg{width:16px;height:16px}
.slide{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0}
.slide .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.slide .lab b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:7px 10px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.tg.on{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.dlab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* signal ticker */
#ticker{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.tkl{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#tkCard .card3{width:200px;background:var(--panel2)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:11.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink3)}
.step.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.bytes{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:12px}
.bytes .who{font-family:var(--f-body);font-size:12px;color:var(--ink2);margin-right:6px}
.by{padding:1px 4px;border-radius:3px;color:var(--ink3);border:1px solid transparent}
.by.lit{color:var(--ink);border-color:var(--line);background:var(--panel2)}
.by.cur{color:var(--accent-ink);background:var(--accent)}
.note{font-size:11.5px;color:var(--ink3)}

/* legend */
#legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink2);padding:9px 11px}
#legend div{display:flex;align-items:center;gap:7px}
#legend i{width:16px;height:4px;border-radius:2px;display:inline-block}

/* 3D labels */
.l3{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
.l3 .t{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:6px;padding:3px 7px;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.l3 .t b{font-size:12px;font-weight:500}
.l3 .t small{font-family:var(--f-mono);font-size:10px;color:var(--ink2)}
.l3 .stem{width:1px;height:22px;background:var(--ink3)}
.l3 .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:-1px}
.l3.sel .t{border-color:var(--accent);background:var(--accent)}
.l3.sel .t b,.l3.sel .t small{color:var(--accent-ink)}
.l3.sel .stem,.l3.sel .dot{background:var(--accent)}
.card3{pointer-events:none;width:auto;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--accent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11.5px}
.card3 .h{font-family:var(--f-mono);font-size:10.5px;color:var(--ink2);letter-spacing:.06em}
.card3 svg{display:block;width:100%;height:auto;margin:4px 0}
.card3 svg text{font-family:var(--f-mono);font-size:9px;fill:var(--ink2)}
.card3 .gate{fill:none;stroke:var(--off);stroke-width:1.4;stroke-dasharray:3 2}
.card3 .gate.on{stroke:var(--accent);stroke-dasharray:none;fill:var(--accent-soft)}
.card3 .wire{stroke:var(--off);stroke-width:1.2;fill:none}
.card3 .wire.on{stroke:var(--accent)}
.card3 .st{font-weight:500}

#tip{position:fixed;pointer-events:none;padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;white-space:nowrap;transform:translate(12px,12px);z-index:5}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px;pointer-events:none}

@media (max-width:1100px){#legend{display:none}}
@media (max-width:760px){
  h1{font-size:23px}
  #head{gap:6px}
  #sheet{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(var(--dockh,150px) + 22px + env(safe-area-inset-bottom,0px));max-height:44%}
  #sheet .grip{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border:0;background:none;cursor:pointer;font-size:13px;width:100%}
  #sheet .grip b{font-weight:500}
  #sheet:not(.open) #sheetBody{display:none}
  #sheetBody{padding-top:4px}
  #dock{padding:9px 11px}
  .seg button{padding:6px 8px}
  .slide{flex-basis:200px}
  #tkCard{display:none}
  #tnote{display:none}
  #dock .drow{gap:8px}
}
@media (prefers-reduced-motion:reduce){.l3{transition:none}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading">正在载入 three.js（需要联网）…</div>

<header id="head">
  <div class="eyebrow">whj_MCU · XL330 通信实验</div>
  <h1>信号链<em>爆炸图</em></h1>
  <nav id="chain" aria-label="信号链">
    <button class="node" data-p="mcu"><b>KM1M7C</b><span>MCU · 3.3V</span></button>
    <div class="link">TX RX DIR<i>⇄</i></div>
    <button class="node" data-p="txb"><b>TXB0104</b><span>3.3V ⇄ 5V</span></button>
    <div class="link">5V<i>⇄</i></div>
    <button class="node" data-p="u241"><b>74LVC2G241</b><span>TX+RX → DATA</span></button>
    <div class="link">DATA<i>⇄</i></div>
    <button class="node" data-p="servo"><b>XL330</b><span>舵机</span></button>
  </nav>
</header>

<aside id="sheet" class="glass" aria-label="零件说明">
  <button class="grip" id="grip"><b id="gripName">零件说明</b><span id="gripArrow">展开</span></button>
  <div id="sheetBody"></div>
</aside>

<div id="legend" class="glass" aria-label="线色">
  <div><i style="background:var(--w5)"></i>5V</div>
  <div><i style="background:var(--wg)"></i>GND</div>
  <div><i style="background:var(--w33)"></i>3.3V</div>
  <div><i style="background:var(--wdir)"></i>DIR 方向</div>
  <div><i style="background:var(--wrx)"></i>RX 接收</div>
  <div><i style="background:var(--wtx)"></i>TX 发送</div>
  <div><i style="background:var(--wdata)"></i>DATA</div>
</div>

<section id="dock" class="glass" aria-label="控制">
  <div class="drow">
    <button id="play" aria-label="爆炸 / 装配"><svg viewBox="0 0 16 16" id="playIco"><path d="M3 2l11 6-11 6z" fill="currentColor"/></svg></button>
    <div class="slide">
      <div class="lab"><span>装配</span><b id="tval">0%</b><span>爆炸</span></div>
      <input id="tSlider" type="range" min="0" max="1000" value="0" aria-label="爆炸程度">
    </div>
    <div class="slide" style="flex-basis:150px">
      <div class="lab"><span>舵机合上</span><b id="sval">0%</b><span>拆开</span></div>
      <input id="sSlider" type="range" min="0" max="1000" value="0" aria-label="舵机内部">
    </div>
  </div>
  <div class="drow">
    <span class="dlab">信号</span>
    <div class="seg" id="sig">
      <button data-m="off" class="on">关</button>
      <button data-m="tx">发送</button>
      <button data-m="rx">接收</button>
      <button data-m="auto">一问一答</button>
    </div>
    <div class="tog">
      <button class="tg on" id="tLabels">标注</button>
      <button class="tg" id="tXray">透视</button>
      <button class="tg" id="tSpin">自转</button>
      <button class="tg" id="tReset">重置视角</button>
    </div>
  </div>
  <div id="ticker" hidden>
    <div class="tkl">
      <div class="steps" id="steps"></div>
      <div class="bytes" id="bytes"></div>
      <div class="note" id="tnote"></div>
    </div>
    <div id="tkCard"></div>
  </div>
</section>
<div id="tip" hidden></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   坐标：单位 mm。面包板顶面 y = 0，桌面 y = TABLE。
   x 沿列（第 1→28 列），z 沿行（L 在远处 −z，A 在近处 +z），
   和 docs/breadboard 的布局图同一个方向。
   ============================================================ */
const P = 2.54, TABLE = -8.9, UP_DZ = -40.64;
const cx = c => (c - 14.5) * P;
const ROWS = 'ABCDEFGHIJKL';
const rowZ = r => { const i = ROWS.indexOf(r); return i < 6 ? 16.51 - i * P : -3.81 - (i - 6) * P; };
const RAILX = {V1N:-44.45, V1P:-41.91, V3P:41.91, V3N:44.45};
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function holeXZ(s){
  if (s.includes(':')) { const [k,r] = s.split(':'); return [RAILX[k], rowZ(r)]; }
  const m = s.match(/^(\d+)([A-L])$/); return [cx(+m[1]), rowZ(m[2])];
}

/* ---------------- 零件说明（面板里显示的文字） ---------------- */
const INFO = {
  bb_shell:{n:'面包板',en:'Solderless breadboard',cat:'底座',where:'所有元件插在这里',
    role:'免焊接的插线板。每个孔下面藏着金属簧片，插进同一组孔的引脚就被连在一起。这块板 28 列：每列槽下方 A–F 一组、槽上方 G–L 一组；左右的 V1、V3 是电源轨，整条相通。本实验只用下半块。',
    specs:[['孔距','2.54 mm（0.1 英寸）'],['中间槽宽','7.62 mm（0.3 英寸）'],['触点电流','约 1 A'],['V1','外部 5V（+ 靠里，− 靠外）'],['V3 −','MCU 的 GND']],
    tip:'<b>记号</b>：“6下” = 第 6 列槽下方任一孔，“6上” = 槽上方。舵机的大电流不要走面包板，触点只扛得住约 1 A。'},
  bb_strips:{n:'金属簧片',en:'Contact clips',cat:'底座内部',where:'面包板里面',
    role:'每组孔下面是一片弯成夹子形状的金属弹片，夹住插进来的引脚。同一片上的孔电气相通，不同片之间互不相通。槽两边各一片，所以跨在槽上的芯片两排引脚不会短路。电源轨下面是一整条长簧片。',
    specs:[['每片连通','6 个孔（A–F 或 G–L）'],['电源轨','整条相通（上电前用万用表实测确认）']],
    tip:'<b>为什么要懂这个</b>：tools/check_wiring.py 就是按这条规则把每个孔归到网络，再和电路图比对。打开“信号”动画，可以看到电流从导线钻进簧片、再走到芯片引脚。'},
  bb_backing:{n:'背胶',en:'Adhesive backing',cat:'底座',where:'面包板底面',
    role:'双面胶加离型纸，把簧片封在板子里，也能把面包板粘在底板上。撕掉后簧片可能掉出来，别撕。',specs:[]},

let grid = null;
function buildGrid(){
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  const c = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#888';
  grid = new THREE.GridHelper(1000, 100, c, c);
  grid.material.transparent = true; grid.material.opacity = 0.55; grid.material.depthWrite = false;
  grid.position.y = TABLE - 0.05; scene.add(grid);
}

function canvasTex(wmm, hmm, ppm, draw){

function mesh(geo, mat, x=0, y=0, z=0){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; return m; }

function cylB(r,h,mat,x,yb,z,seg=24){ return mesh(new THREE.CylinderGeometry(r,r,h,seg), mat, x, yb+h/2, z); }
function polyTube(pts, r, mat, seg=6){
  const path = new THREE.CurvePath();

const parts = new Map(); const order = [];
function part(id, parent, o={}){
  const g = new THREE.Group(); g.name = id;
  (parent ? parts.get(parent).group : scene).add(g);
  const p = {id, parent, group:g, children:[], home:V(...(o.pos||[0,0,0])), off:V(...(o.off||[0,0,0])), d:o.d||0, axis:o.axis||'t',
    info:o.info||INFO[id], label:o.label, swatch:o.swatch, dyn:!!o.dyn, prog:0, meshes:[], flags:{sel:false,hov:false}, glow:null, glowK:0};
  g.position.copy(p.home);

  parts.set(id, p); order.push(p); return p;
}

/* 排针：pts 为同一排的 [x,z] */
function header(group, pts, {yb=-5.6, yt=7.2, sy=0, sh=2.5}={}){
  for (const [x,z] of pts) group.add(boxB(0.64, yt-yb, 0.64, M.gold, x, yb, z));
  const xs = pts.map(p=>p[0]), zs = pts.map(p=>p[1]);
  const w = Math.max(...xs)-Math.min(...xs)+P, d = Math.max(...zs)-Math.min(...zs)+P;
  group.add(boxB(w-0.1, sh, d-0.1, M.black, (Math.max(...xs)+Math.min(...xs))/2, sy, (Math.max(...zs)+Math.min(...zs))/2));
}
/* 贴片芯片：本体 + 两侧鸥翼脚 + 顶面丝印 */
function smdChip(group, {x,y,z,w,d,h=0.9,n,pitch,side='z',mark,markSize=0.7}){
  const top = canvasTex(w, d, 60, (g)=>{ g.fillStyle='#1a1b1d'; g.fillRect(0,0,w,d); txt(g, mark, w/2, d/2, markSize, '#9a9da2'); g.fillStyle='#55585c'; g.beginPath(); g.arc(0.55,d-0.55,0.22,0,7); g.fill(); });
  const mats = [M.chip, M.chip, new THREE.MeshStandardMaterial({map:top, roughness:0.45}), M.chip, M.chip, M.chip];
  group.add(mesh(new THREE.BoxGeometry(w,h,d), mats, x, y+h/2, z));
  const legL = 0.55;
  for (let i=0;i<n;i++){
    const o = (i-(n-1)/2)*pitch;
    for (const s of [-1,1]){
      const lx = side==='z' ? x+o : x+s*(w/2+legL/2-0.05);
      const lz = side==='z' ? z+s*(d/2+legL/2-0.05) : z+o;
      group.add(boxB(side==='z'?pitch*0.45:legL, 0.14, side==='z'?legL:pitch*0.45, M.tin, lx, y, lz));
    }
  }
}

const BAND = {brown:0x6b3a1e, black:0x161616, orange:0xe0731d, yellow:0xe6c329, gold:0xc9a24a};
function resistor(id, a, b, bands, {stand=false, off=16, d=0.22}={}){

   ============================================================ */
const MCU_PIN = {'3V3':14,'DIR':15,'RX':16,'TX':17,'GND':32};
const MCU_Z = 39;
const wires = {};
function endPoint(s){
  if (s.startsWith('MCU:')) return {dev:'mcu', anchor:'mcu_'+s.slice(4)};
  if (s.startsWith('EXT:')) return {dev:'ext', anchor:'ext_'+s.slice(4)};
  const [x,z] = holeXZ(s); return {hole:s, pos:V(x,0.9,z)};
}
function buildWires(){
  WIRES.forEach(([id,a,b,col,note,o={}],i)=>{
    const A = endPoint(a), B = endPoint(b);
    const dyn = !!(A.dev || B.dev);
    const lift = col==='g'||col==='5' ? 30 : 34 + (i%3)*2;
    const p = part(id, null, {off:[0, dyn?26:lift, 0], d:dyn?0.3:0.38+(i%4)*0.02, dyn, swatch:WCSS[col],
      info:{n:`${id} · ${WNAME[col]}`, en:`${a.replace('EXT:','电源 ').replace('MCU:','MCU ')} → ${b.replace('MCU:','MCU ')}`, cat:'导线', where:WNAME[col], role:note, specs:[['起点',a],['终点',b],['线色',WNAME[col]]]}});
    const mat = wireMat(WCOL[col]);
    const w = {id, a:A, b:B, col, mat, part:p, o, dyn, curve:null, meshes:{}};
    wires[id] = w;
    if (!dyn){
      w.curve = wireCurve(A.pos, B.pos, o);
      p.group.add(mesh(new THREE.TubeGeometry(w.curve, 64, 0.48, 8, false), mat));
      for (const E of [A.pos,B.pos]) p.group.add(cylB(0.3, 6.6, M.tin, E.x, -5.7, E.z, 10));
    } else {
      w.meshes.tube = mesh(new THREE.BufferGeometry(), mat); p.group.add(w.meshes.tube);
      const hole = A.hole ? A : B;
      w.meshes.pin = mesh(new THREE.CylinderGeometry(0.3,0.3,6.6,10), M.tin); p.group.add(w.meshes.pin);
      w.holePos = hole.pos;
      w.dev = (A.dev ? A : B);
      if (w.dev.dev === 'mcu'){ w.meshes.housing = mesh(new THREE.BoxGeometry(2.45,8.4,2.45), mat); p.group.add(w.meshes.housing); }
    }
  });
}
function wireCurve(a, b, o={}){
  const h = o.h ?? Math.min(14, Math.max(2.8, a.distanceTo(b)*0.3));
  const lat = V(...(o.lat||[0,0,0]));
  return new THREE.CubicBezierCurve3(a.clone(), a.clone().add(V(0,h,0)).add(lat), b.clone().add(V(0,h,0)).add(lat), b.clone());
}
function rebuildDynamic(){
  for (const id in wires){
    const w = wires[id]; if (!w.dyn) continue;
    const lift = w.part.off.clone().multiplyScalar(w.part.prog);
    const H = w.holePos.clone().add(lift);
    const D = wp(w.dev.anchor);
    const holeFirst = !!w.a.hole;
    const s = holeFirst ? H : D, e = holeFirst ? D : H;
    const up = (pt, isHole) => isHole ? V(0, 10, 0) : V(0, 12, 0);
    w.curve = new THREE.CubicBezierCurve3(s, s.clone().add(up(s,holeFirst)), e.clone().add(up(e,!holeFirst)), e);
    w.meshes.tube.geometry.dispose(); w.meshes.tube.geometry = new THREE.TubeGeometry(w.curve, 56, 0.48, 8, false);
    w.meshes.pin.position.set(H.x, H.y-0.9-3.3, H.z);
    if (w.meshes.housing) w.meshes.housing.position.set(D.x, D.y-4.2, D.z);
  }
  // 舵机线：三根并排
  const s = wp('k3_3'), e = wp('servo_plug');
  const c = new THREE.CubicBezierCurve3(s, s.clone().add(V(0,18,0)), e.clone().add(V(0,3,-22)), e);
  servoCable.curve = c;
  const side = V(1,0,0);
  [-1,0,1].forEach((k,i)=>{
    const pts = c.getPoints(60).map((p,j)=>p.clone().addScaledVector(side, k*0.95*(1-0.55*j/60)));
    const cc = new THREE.CatmullRomCurve3(pts);
    const m = servoCable.tubes[i]; m.geometry.dispose(); m.geometry = new THREE.TubeGeometry(cc, 60, 0.45, 8, false);
  });
}

    pts.forEach(([R,t],k)=>{ const x = R*Math.cos(t), y = R*Math.sin(t); (i===0&&k===0) ? s.moveTo(x,y) : s.lineTo(x,y); });
  }

const TX_PATH = ['@mcu_core','@mcuB_TX','~S3','@s17B','@s17E','@htxb_17E','@ptxb_17E','@ctxb','@ptxb_17G','@htxb_17G','@s17G','@s17L','~S6','@s9L','@s9G','@h241_9G','@p241_9G','@c241','@p241_8F','@h241_8F','@s8F','@s8C','~S8','@s4C','@s4B','@k3pin_4','@k3_4','~cable','@servo_plug','@servo_core'];
const RX_PATH = ['@servo_core','@servo_plug','~cable-','@k3_4','@k3pin_4','@s4B','@s4A','~S9-','@s7A','@s7F','@h241_7F','@p241_7F','@c241','@p241_8G','@h241_8G','@s8G','@s8L','~S5','@s16L','@s16G','@htxb_16G','@ptxb_16G','@ctxb','@ptxb_16E','@htxb_16E','@s16E','@s16B','~S2','@mcuB_RX','@mcu_core'];
function pathPoints(spec){
  const pts = [];
  for (const t of spec){
    if (t[0]==='@'){ pts.push(wp(t.slice(1))); continue; }
    const rev = t.endsWith('-'), id = t.slice(1).replace('-','');
    let ps;
    if (id==='cable') ps = servoCable.curve.getPoints(30);
    else { const w = wires[id]; ps = w.curve.getPoints(40); if (!w.dyn) ps = ps.map(p=>p.add(w.part.group.position)); }
    if (rev) ps.reverse();
    pts.push(...ps);
  }
  return pts;
}
function sampler(pts){
  const acc = [0]; for (let i=1;i<pts.length;i++) acc.push(acc[i-1]+pts[i].distanceTo(pts[i-1]));
  const L = acc[acc.length-1];
  return u => { const d = u*L; let lo=0, hi=acc.length-1; while (hi-lo>1){ const m=(lo+hi)>>1; acc[m]<d?lo=m:hi=m; }
    const f = (d-acc[lo])/Math.max(1e-6, acc[hi]-acc[lo]); return pts[lo].clone().lerp(pts[hi], f); };
}
const glowTex = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.25,'rgba(255,255,255,.85)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
function makeStream(color){
  const N = 48, geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  const mat = new THREE.PointsMaterial({color, size:9, map:glowTex, transparent:true, depthTest:false, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true});
  const pts = new THREE.Points(geo, mat); pts.renderOrder = 10; pts.frustumCulled = false; scene.add(pts);
  return {pts, geo, us:[], emitAcc:0, N};
}
let txS, rxS;
const PHASES = [['dir1',0.6,'DIR = 1'],['tx',2.6,'发 10 字节'],['tc',0.6,'等 TC'],['dir0',0.5,'DIR = 0'],['wait',0.7,'≈ 0.5 ms'],['rx',3.0,'收 14 字节'],['idle',1.2,'空闲']];
const PING = 'FF FF FD 00 01 03 00 01 19 4E'.split(' ');
const PONG = 'FF FF FD 00 01 07 00 55 00 B0 04 ·· ·· ··'.split(' ');
let phaseT = 0, phaseI = 0;
function curPhase(){ return PHASES[phaseI][0]; }
function stepStreams(dt){
  let txOn=false, rxOn=false, prog=0;
  if (state.mode==='tx'){ txOn = true; state.dir = 1; phaseT = (phaseT+dt)%2.6; prog = phaseT/2.6; }
  else if (state.mode==='rx'){ rxOn = true; state.dir = 0; phaseT = (phaseT+dt)%3.0; prog = phaseT/3.0; }
  else if (state.mode==='auto'){
    phaseT += dt; while (phaseT > PHASES[phaseI][1]){ phaseT -= PHASES[phaseI][1]; phaseI = (phaseI+1)%PHASES.length; }
    const k = curPhase(); prog = phaseT/PHASES[phaseI][1];
    state.dir = (k==='dir1'||k==='tx'||k==='tc') ? 1 : 0;
    txOn = k==='tx'; rxOn = k==='rx';
  }
  if (state.mode!=='off' && lastDir!==state.dir){ lastDir = state.dir; updateCard(); }
  const txP = sampler(pathPoints(TX_PATH)), rxP = sampler(pathPoints(RX_PATH));
  for (const [S,on,f] of [[txS,txOn,txP],[rxS,rxOn,rxP]]){
    if (on){ S.emitAcc += dt; while (S.emitAcc > 0.11){ S.emitAcc -= 0.11; if (S.us.length < S.N) S.us.push(0); } }
    S.us = S.us.map(u=>u+dt/2.4).filter(u=>u<1);
    const a = S.geo.attributes.position.array; a.fill(0);
    S.us.forEach((u,i)=>{ const p = f(u); a[i*3]=p.x; a[i*3+1]=p.y; a[i*3+2]=p.z; });
    S.geo.setDrawRange(0, S.us.length); S.geo.attributes.position.needsUpdate = true;
  }
  updateTicker(txOn, rxOn, prog);
  return {txOn, rxOn};
}
let lastDir = -1, tickKey = '';
function updateTicker(txOn, rxOn, prog){
  const tk = document.getElementById('ticker');
  if (state.mode==='off'){ tk.hidden = true; return; }
  tk.hidden = false;
  const steps = document.getElementById('steps');
  const sh = state.mode==='auto' ? PHASES.map((p,i)=>`<span class="step${i===phaseI?' on':''}">${p[2]}</span>`).join('')
    : state.mode==='tx' ? '<span class="step on">DIR = 1</span><span class="step">MCU → 舵机，连续发 ping</span>' : '<span class="step on">DIR = 0</span><span class="step">舵机 → MCU，连续回应答</span>';
  if (steps.dataset.h !== sh){ steps.dataset.h = sh; steps.innerHTML = sh; }
  const isTx = state.mode==='tx' || (state.mode==='auto' && PHASES[phaseI][0]!=='rx' && phaseI<4);
  const bytes = isTx ? PING : PONG;
  let lit = 0;
  if (txOn || rxOn) lit = Math.floor(prog*bytes.length);
  else if (state.mode==='auto') lit = phaseI<5 && phaseI>1 ? bytes.length : (phaseI===6 ? PONG.length : 0);
  const key = state.mode+(isTx?'t':'r')+lit+'|'+(state.mode==='auto'?phaseI:'');
  if (key===tickKey) return; tickKey = key;
  document.getElementById('bytes').innerHTML = `<span class="who">${isTx?'MCU → 舵机（ping）':'舵机 → MCU（应答）'}</span>` + bytes.map((b,i)=>`<span class="by${i<lit?' lit':''}${(txOn||rxOn)&&i===lit?' cur':''}">${b}</span>`).join('');
  document.getElementById('tnote').textContent = isTx
    ? 'ID 1 · 57600 8N1。真实发送 10 字节约 1.7 ms，动画放慢了一千多倍。'
    : '正常应答 14 字节：B0 04 = 型号 1200（XL330-M288），后 3 字节是固件版本和 CRC。';
}

const tmpC = new THREE.Color();
function updateVisuals(time, sig){
  const anySel = !!state.sel;
  const stripP = parts.get('bb_strips').prog;
  for (const m of allMeshes){
    const p = parts.get(m.userData.pid);
    let op = 1;
    if (anySel && !p.flags.sel) op = 0.13;
    if (p.id==='bb_shell') op *= state.xray ? 0.22 : (1 - 0.5*stripP);
    if (p.id==='servo_frame') op *= state.xray ? 0.25 : 1 - 0.6*Math.min(1, state.s*1.5);
    else if (state.xray && (p.id==='servo_top'||p.id==='servo_bottom')) op *= 0.25;
    let ek = 0; tmpC.setRGB(0,0,0);
    if (p.flags.hov){ tmpC.copy(ACC); ek = 0.35; }
    if (sig && wires[p.id]){
      const id = p.id;
      const on = (TXW.includes(id) && sig.txOn) || (RXW.includes(id) && sig.rxOn) || (DIRW.includes(id) && state.dir===1);
      if (on){ tmpC.setHex(WCOL[wires[id].col]); ek = 0.55 + 0.25*Math.sin(time*8); }
    }
    for (const mat of m.userData.mats){
      const b = mat.userData.base, o = b.op*op;
      const tr = b.tr || o < 0.999;
      if (mat.transparent !== tr){ mat.transparent = tr; mat.needsUpdate = true; }
      mat.opacity = o; mat.depthWrite = o > 0.5;
      if (mat.emissive){
        if (ek > 0){ mat.emissive.copy(tmpC); mat.emissiveIntensity = ek; }
        else if (b.em){ mat.emissive.copy(b.em); mat.emissiveIntensity = b.ei; }
      }
    }
  }
  // 标注
  for (const {p,o,el} of labelObjs){
    let vis = state.labels;
    const inServo = p.id.startsWith('servo_');
    if (MAJOR.has(p.id)) vis = vis && (state.t > 0.16 || p.flags.sel);
    else if (PASSIVE.has(p.id)) vis = vis && (state.t > 0.85 || p.flags.sel) && state.mode==='off';
    else if (inServo) vis = vis && state.s > 0.3;
    else vis = vis && state.t > 0.72;
    if (p.id==='servo' && state.s > 0.3) vis = false;
    if (p.id==='bb_strips' && state.t < 0.3) vis = false;
    if (p.id==='bb_shell' && state.t > 0.3) vis = false;
    if (anySel && !p.flags.sel) vis = false;
    o.visible = vis;
    el.classList.toggle('sel', state.sel===p.id);
  }
}

      <div class="tags"><span class="tag">${esc(I.cat)}</span><span class="tag where">${esc(I.where)}</span></div>
      <p class="role">${esc(I.role)}</p>
      ${I.specs && I.specs.length ? `<dl class="specs">${I.specs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${id.startsWith('u241') ? gateCard() : ''}
      ${I.tip ? `<div class="tip">${I.tip}</div>` : ''}
      ${p.children.length ? `<div class="grp"><h3>组成</h3>${p.children.map(c=>`<button class="pl" data-p="${c.id}"><span class="sw" style="background:var(--panel2)"></span>${esc(c.info.n)}</button>`).join('')}</div>` : ''}
      <div class="row">
        ${servoKids ? `<button class="btn pri" data-servo>${state.s>0.5?'合上舵机':'拆开舵机'}</button>` : ''}
        <button class="btn" data-focus>对准它</button>
        <button class="btn" data-clear>取消选择</button>
      </div>`;
    updateCard();
  }
}
sheetBody.addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) select(b.dataset.p, true);
  else if ('clear' in b.dataset) select(null);
  else if ('focus' in b.dataset) focusPart(state.sel);
  else if ('servo' in b.dataset) toggleServo();
});
document.getElementById('chain').addEventListener('click', e=>{ const b = e.target.closest('.node'); if (b) select(b.dataset.p, true); });
const sheet = document.getElementById('sheet');
document.getElementById('grip').addEventListener('click', ()=>{ sheet.classList.toggle('open'); document.getElementById('gripArrow').textContent = sheet.classList.contains('open') ? '收起' : '展开'; });

function select(id, focus=false){
  state.sel = id; setFlags(); renderSheet();
  if (id && focus) focusPart(id);
  if (!id) homeView();
}
function toggleServo(){
  const open = state.s < 0.5;
  state.sTarget = open ? 1 : 0;
  if (open && (!state.sel || !(state.sel==='servo'||state.sel.startsWith('servo_')))) state.sel = 'servo';
  setFlags(); renderSheet(); focusPart('servo');
}

/* ---------------- 指针 ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(allMeshes, false);
  for (const h of hits){
    const p = parts.get(h.object.userData.pid);
    if (!h.object.visible) continue;
    if (state.sel && !p.flags.sel && hits.some(o=>parts.get(o.object.userData.pid).flags.sel)) continue;
    if (p.id==='bb_shell' && state.xray) continue;
    return p.id;
  }
  return null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (!down) return; const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y); down = null;
  if (moved > 5) return;
  const id = pick(e);
  select(id, !!id);
});
let hovQueued = null;
renderer.domElement.addEventListener('pointermove', e=>{ if (e.pointerType==='mouse') hovQueued = e; });
renderer.domElement.addEventListener('pointerleave', ()=>{ hovQueued = null; state.hov = null; setFlags(); tip.hidden = true; });
function doHover(){
  if (!hovQueued || down) return; const e = hovQueued; hovQueued = null;
  const id = pick(e);
  if (id !== state.hov){ state.hov = id; setFlags(); renderer.domElement.style.cursor = id ? 'pointer' : 'grab'; }
  if (id){ tip.hidden = false; tip.textContent = parts.get(id).info.n; tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; }
  else tip.hidden = true;
}

/* ---------------- 控制条 ---------------- */
const tS = document.getElementById('tSlider'), sS = document.getElementById('sSlider');
tS.addEventListener('input', ()=>{ state.t = tS.value/1000; state.tTarget = null; });
sS.addEventListener('input', ()=>{ state.s = sS.value/1000; state.sTarget = null; });
const playIco = document.getElementById('playIco');
document.getElementById('play').addEventListener('click', ()=>{ state.tTarget = state.t > 0.5 ? 0 : 1; });
document.getElementById('sig').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  state.mode = b.dataset.m; phaseI = 0; phaseT = 0; tickKey = ''; lastDir = -1;
  document.querySelectorAll('#sig button').forEach(x=>x.classList.toggle('on', x===b));
  if (state.mode==='off'){ txS.us = []; rxS.us = []; }
  if (state.mode!=='off' && state.t < 0.35) state.tTarget = 0.55;
  document.getElementById('ticker').hidden = state.mode==='off'; resize();
});
const tg = (id, k, after) => document.getElementById(id).addEventListener('click', e=>{ state[k] = !state[k]; e.currentTarget.classList.toggle('on', state[k]); after && after(); });
tg('tLabels','labels'); tg('tXray','xray'); tg('tSpin','spin', ()=>{ controls.autoRotate = state.spin; });
controls.autoRotateSpeed = 0.6;
document.getElementById('tReset').addEventListener('click', ()=>{ select(null); });
addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='Escape') select(null);
  else if (e.key===' '){ e.preventDefault(); state.tTarget = state.t > 0.5 ? 0 : 1; }
  else if (e.key==='x'||e.key==='X') document.getElementById('tXray').click();
});

/* ---------------- 主循环 ---------------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); css.setSize(w, h); camera.aspect = w/h;
  const dh = document.getElementById('dock').offsetHeight;
  document.documentElement.style.setProperty('--dockh', dh+'px');
  // 让画面中心落在“没被面板挡住”的区域：桌面端右侧有说明面板，底部有控制条
  if (w > 760) camera.setViewOffset(w, h, Math.round((sheet.offsetWidth+16)/2), Math.round(dh/2 - 50), w, h);
  else camera.setViewOffset(w, h, 0, Math.round(dh/2 - 10), w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
const clock = new THREE.Clock();
let lastT = -1, lastS = -1;
function loop(){
  const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
  for (const [k,kt,sl,lab] of [['t','tTarget',tS,'tval'],['s','sTarget',sS,'sval']]){
    if (state[kt] != null){
      const d = state[kt]-state[k], step = dt/(k==='t'?1.6:1.2);
      state[k] = Math.abs(d) <= step ? state[kt] : state[k]+Math.sign(d)*step;
      if (state[k]===state[kt]) state[kt] = null;
      sl.value = Math.round(state[k]*1000);
    }
    if (state[kt] == null && document.activeElement !== sl) sl.value = Math.round(state[k]*1000);
    document.getElementById(lab).textContent = Math.round(state[k]*100)+'%';
  }
  const collapsing = (state.tTarget ?? state.t) > 0.5;
  if (playIco.dataset.c !== String(collapsing)) { playIco.dataset.c = String(collapsing); playIco.innerHTML = collapsing
    ? '<path d="M3 3h10v10H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 6h4v4H6z" fill="currentColor"/>'
    : '<path d="M8 1v5M8 10v5M1 8h5M10 8h5" stroke="currentColor" stroke-width="2" fill="none"/>'; }
  if (state.t!==lastT || state.s!==lastS){ applyExplode(); lastT = state.t; lastS = state.s;
    const sb = document.querySelector('[data-servo]'); if (sb) sb.textContent = (state.sTarget ?? state.s) > 0.5 ? '合上舵机' : '拆开舵机'; }
  if (camTween){
    const k = Math.min(1, (performance.now()-camTween.t0)/camTween.dur), e = ease(k);
    controls.target.lerpVectors(camTween.ft, camTween.tt, e); camera.position.lerpVectors(camTween.fp, camTween.tp, e);
    if (k>=1) camTween = null;
  }
  controls.update();
  doHover();
  const sig = state.mode!=='off' ? stepStreams(dt) : null;
  if (!sig && txS){ txS.geo.setDrawRange(0,0); rxS.geo.setDrawRange(0,0); }
  updateVisuals(time, sig);
  renderer.render(scene, camera); css.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------------- 主题 ---------------- */
function onTheme(){ readAccent(); buildGrid(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ---------------- 启动 ---------------- */
await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]);
buildAll(); applyExplode(); buildLabels(); onTheme();
txS = makeStream(0xffb21a); rxS = makeStream(0x2fe070);
document.getElementById('tkCard').innerHTML = gateCard(); updateCard(); setFlags(); renderSheet(); resize(); homeView(false);
document.getElementById('loading').remove();
if (REDUCED) state.t = 0.6; else setTimeout(()=>{ state.tTarget = 0.62; }, 500);
window.__xl330 = {state, parts, select, toggleServo, step:n=>{ for (let i=0;i<n;i++) stepStreams(0.05); }};
loop();
</script>

</body>
